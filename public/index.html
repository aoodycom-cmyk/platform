  <script>
    (function () {
      var version = "v11-franklin-v39-20260822-static-rescue1";
      var marker = "franklin-cache-version-seen";
      if (!("serviceWorker" in navigator) || !("caches" in window)) return;
      try {
        if (localStorage.getItem(marker) === version) return;
        localStorage.setItem(marker, version);
      } catch (_) {}
      Promise.allSettled([
        navigator.serviceWorker.getRegistrations().then(function (items) {
          return Promise.allSettled(items.map(function (item) { return item.unregister(); }));
        }),
        caches.keys().then(function (keys) {
          return Promise.allSettled(keys.filter(function (key) { return key.indexOf("franklin-research") === 0; }).map(function (key) { return caches.delete(key); }));
        })
      ]);
    }());
  </script>

  <script src="./backend-config.js?v=v11-franklin-v39-20260822-static-rescue1"></script>
  <script>
    (function () {
      var originalUrlToString = URL.prototype.toString;
      var lastAuditUrl = "";

      function showAuditLink(url) {
        if (!url || url === lastAuditUrl) return;
        lastAuditUrl = url;
        sessionStorage.setItem("franklin-last-audit-url", url);
        var existing = document.getElementById("franklin-audit-link-fallback");
        if (existing) existing.remove();

        var wrap = document.createElement("div");
        wrap.id = "franklin-audit-link-fallback";
        wrap.style.cssText = "position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.72);display:grid;place-items:end center;padding:16px;box-sizing:border-box";
        wrap.innerHTML = '<section dir="rtl" style="width:min(100%,520px);background:#111422;color:#f1f3f9;border:1px solid #303851;border-radius:20px;padding:18px;font-family:system-ui;box-shadow:0 28px 70px rgba(0,0,0,.5)"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><strong style="font-size:17px">رابط فحص Franklin جاهز</strong><button type="button" data-audit-close style="width:44px;height:44px;border:0;border-radius:12px;background:#181c2e;color:#fff;font-size:22px">×</button></div><p style="font-size:13px;line-height:1.7;color:#c5cad8">احتفظ بهذا الرابط أو أرسله مباشرة. صلاحية الرابط 24 ساعة وهو للقراءة فقط.</p><textarea data-audit-url readonly dir="ltr" style="box-sizing:border-box;width:100%;min-height:96px;border:1px solid #303851;border-radius:12px;background:#0b0d16;color:#f1f3f9;padding:10px;font-size:13px;line-height:1.5;resize:none"></textarea><div style="display:grid;gap:10px;margin-top:12px"><button type="button" data-audit-copy style="min-height:48px;border:0;border-radius:12px;background:#2dd4bf;color:#07100f;font-weight:800">نسخ الرابط</button><button type="button" data-audit-share style="min-height:48px;border:1px solid #303851;border-radius:12px;background:#181c2e;color:#fff;font-weight:750">مشاركة الرابط</button></div></section>';
        document.body.appendChild(wrap);
        var field = wrap.querySelector("[data-audit-url]");
        var copy = wrap.querySelector("[data-audit-copy]");
        var share = wrap.querySelector("[data-audit-share]");
        field.value = url;

        copy.addEventListener("click", async function () {
          var copied = false;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(url);
              copied = true;
            }
          } catch (_) {}
          if (!copied) {
            field.focus();
            field.select();
            field.setSelectionRange(0, field.value.length);
            try { copied = document.execCommand("copy"); } catch (_) {}
          }
          copy.textContent = copied ? "تم النسخ ✓" : "حدد الرابط ثم اختر نسخ";
        });

        if (navigator.share) {
          share.addEventListener("click", function () {
            navigator.share({ title: "Franklin Audit", url: url }).catch(function () {});
          });
        } else {
          share.style.display = "none";
        }
        wrap.querySelector("[data-audit-close]").addEventListener("click", function () { wrap.remove(); });
      }

      URL.prototype.toString = function () {
        var value = originalUrlToString.call(this);
        if (typeof value === "string" && value.indexOf("#audit=") !== -1) {
          setTimeout(function () { showAuditLink(value); }, 0);
        }
        return value;
      };

      window.addEventListener("pageshow", function () {
        var saved = sessionStorage.getItem("franklin-last-audit-url");
        if (saved && saved.indexOf("#audit=") !== -1) lastAuditUrl = saved;
      });
    }());
  </script>
  <script>
    (function () {
      var rescueVersion = "v11-franklin-v39-20260822-static-rescue1";
      var resetParam = "franklin-reset";
      var bootError = "";

      window.addEventListener("error", function (event) {
        bootError = event.message || "Script error";
      });
      window.addEventListener("unhandledrejection", function (event) {
        bootError = String(event.reason?.message || event.reason || "Promise rejection");
      });

      if (new URLSearchParams(window.location.search).get(resetParam) === "1") {
        resetFranklinState().finally(function () {
          var next = new URL(window.location.href);
          next.searchParams.delete(resetParam);
          next.searchParams.set("v", rescueVersion);
          next.searchParams.set("recovered", "1");
          window.location.replace(next.toString());
        });
      }

      window.addEventListener("DOMContentLoaded", function () {
        window.setTimeout(function () {
          var app = document.getElementById("app");
          if (!app || app.children.length || app.textContent.trim()) return;
          renderRescuePanel(app, bootError);
        }, 3500);
      });

      async function resetFranklinState() {
        try {
          var previous = localStorage.getItem("equityResearchV4State");
          if (previous !== null) {
            localStorage.setItem("franklinManualResetBackup:" + new Date().toISOString(), previous);
          }
          localStorage.removeItem("equityResearchV4State");
          localStorage.removeItem("franklin-cache-version-seen");
          sessionStorage.removeItem("franklin-cache-reset");
        } catch (_) {}

        await Promise.allSettled([
          "serviceWorker" in navigator
            ? navigator.serviceWorker.getRegistrations().then(function (items) {
                return Promise.allSettled(items.map(function (item) { return item.unregister(); }));
              })
            : Promise.resolve(),
          "caches" in window
            ? caches.keys().then(function (keys) {
                return Promise.allSettled(keys.filter(function (key) {
                  return key.indexOf("franklin-research") === 0;
                }).map(function (key) { return caches.delete(key); }));
              })
            : Promise.resolve()
        ]);
      }

      function renderRescuePanel(app, errorText) {
        var resetUrl = new URL(window.location.href);
        resetUrl.searchParams.set(resetParam, "1");
        resetUrl.searchParams.set("v", rescueVersion);
        app.innerHTML = '<main dir="rtl" style="min-height:100svh;display:grid;place-items:center;padding:24px;background:#07080d;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">' +
          '<section style="width:min(100%,520px);border:1px solid rgba(148,163,184,.28);background:#111422;border-radius:18px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.35)">' +
          '<p style="margin:0 0 8px;color:#2dd4bf;font-weight:800">Franklin Research</p>' +
          '<h1 style="margin:0 0 12px;font-size:24px;line-height:1.35">التطبيق موجود، لكن Chrome يفتح نسخة عالقة</h1>' +
          '<p style="margin:0 0 16px;color:#cbd5e1;line-height:1.8">اضغط الزر لإصلاح كاش Franklin وبيانات التشغيل المحلية. سنحفظ نسخة احتياطية داخل المتصفح قبل المسح.</p>' +
          '<a href="' + escapeHtml(resetUrl.toString()) + '" style="display:block;text-align:center;text-decoration:none;border:0;border-radius:14px;background:#2dd4bf;color:#07100f;font-weight:900;padding:14px 16px">إصلاح وفتح Franklin</a>' +
          (errorText ? '<code dir="ltr" style="display:block;white-space:pre-wrap;word-break:break-word;margin-top:14px;background:#0b0d16;border:1px solid rgba(148,163,184,.22);border-radius:12px;padding:12px;color:#fca5a5">' + escapeHtml(errorText) + '</code>' : '') +
          '</section></main>';
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (char) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char];
        });
      }
    }());
  </script>
</head>
