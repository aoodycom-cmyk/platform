  <link rel="manifest" href="./manifest.webmanifest?v=v10-issue-2-qa-followup-2-20260817">
  <script>
    (function () {
      var version = "v10-issue-2-qa-followup-2-20260817";
      if (!("serviceWorker" in navigator) || !("caches" in window)) return;
      if (sessionStorage.getItem("franklin-cache-reset") === version) return;
      sessionStorage.setItem("franklin-cache-reset", version);
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(function (items) {
          return Promise.all(items.map(function (item) { return item.unregister(); }));
        }),
        caches.keys().then(function (keys) {
          return Promise.all(keys.filter(function (key) { return key.indexOf("franklin-research") === 0; }).map(function (key) { return caches.delete(key); }));
        })
      ]).finally(function () {
        window.location.reload();
      });
    }());
  </script>
