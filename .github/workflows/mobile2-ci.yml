name: Franklin Mobile 2.0 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/franklin-mobile-2]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Build public bundle
        run: npm run build
