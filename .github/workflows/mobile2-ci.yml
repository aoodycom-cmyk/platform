name: Franklin Mobile 2.0 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/franklin-mobile-2]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check AI orchestrator syntax
        run: node --check orchestrator/src/run.mjs

      - name: Install
        run: npm ci --ignore-scripts

      - name: Install Chrome test runtime
        run: npx playwright install --with-deps chromium

      - name: Build public bundle
        run: npm run build

      - name: Run static quality gates
        run: npm run quality

      - name: Instrument critical-path coverage
        run: npm run coverage

      - name: Run deep financial truth campaign
        run: npm run test:financial:deep

      - name: Run deep AI integrity red team
        run: npm run test:ai-integrity:deep

      - name: Run frozen real-world benchmark
        run: npm run test:real-world

      - name: Run tests
        env:
          FRANKLIN_UX_ARTIFACT_DIR: artifacts/experience-review
        run: npm test

      - name: Install Safari-compatible test runtime
        run: npx playwright install --with-deps webkit

      - name: Verify WebKit mobile journeys
        env:
          FRANKLIN_E2E_BROWSER: webkit
          FRANKLIN_UX_ARTIFACT_DIR: artifacts/experience-review
        run: npm run test:e2e

      - name: Retain interface review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franklin-experience-review
          path: artifacts/experience-review
          if-no-files-found: ignore
          retention-days: 7
